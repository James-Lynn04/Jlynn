plugins {
    id 'com.android.application'
}

android {
    namespace 'io.jlynn.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'io.jlynn.tvhome'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The UI lives in the repo's web/ folder, shared with the Samsung app.
    sourceSets {
        main.assets.srcDirs = ['../../web']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
