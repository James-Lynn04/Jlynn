<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The wall, lit by a light that follows the sun. -->
  <div class="wall" aria-hidden="true"><div class="light"></div></div>

  <header class="top">
    <div class="meta">
      <div id="date" class="date"></div>
      <div id="sun" class="sun"></div>
    </div>
    <nav class="actions">
      <button class="pill" data-zone="top" data-action="inputs">Inputs</button>
      <button class="pill" data-zone="top" data-action="settings" id="settingsBtn">Settings</button>
    </nav>
  </header>

  <!-- The clock stands on the console. -->
  <div class="clock" aria-live="off"><span id="hh"></span><span class="colon">:</span><span id="mm"></span><span id="ampm" class="ampm"></span></div>

  <!-- The console: a chestnut shelf that holds the apps and rises for All apps. -->
  <section class="shelf">
    <div class="shelf-head">
      <div id="dock" class="dock"></div>
      <div class="hint">All apps<span class="chev"></span></div>
    </div>
    <div id="dockLabel" class="dock-label">&nbsp;</div>
    <div id="drawer" class="drawer">
      <div id="grid" class="grid"></div>
    </div>
  </section>

  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-card">
      <div id="sheetTitle" class="sheet-title"></div>
      <div id="sheetBody" class="sheet-body"></div>
      <div id="sheetList" class="sheet-list"></div>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="hosts.js"></script>
  <script src="app.js"></script>
</body>
</html>
