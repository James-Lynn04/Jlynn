<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sun" aria-hidden="true"></div>

  <header class="bar">
    <div class="when"><span id="time"></span><span id="date" class="date"></span></div>
    <nav class="menu">
      <button class="pill" data-zone="top" data-action="inputs">Inputs</button>
      <button class="pill" data-zone="top" data-action="settings" id="settingsBtn">Settings</button>
    </nav>
  </header>

  <!-- Every app as a line of type. The dock comes first in large type, then all other apps. -->
  <div class="viewport"><ul id="list" class="list"></ul></div>

  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-card">
      <div id="sheetTitle" class="sheet-title"></div>
      <div id="sheetBody" class="sheet-body"></div>
      <div id="sheetList" class="sheet-list"></div>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="hosts.js"></script>
  <script src="app.js"></script>
</body>
</html>
