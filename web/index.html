<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sun" aria-hidden="true"></div>
  <!-- Gameday backdrop: stadium lights, broadcast stripes and a DALLAS wordmark. -->
  <div class="field" aria-hidden="true">
    <div class="lights"></div>
    <div class="stripes"><i></i><i></i><i></i></div>
    <div class="wordmark">DALLAS</div>
  </div>

  <header class="bar">
    <div class="when"><span id="time"></span><span id="date" class="date"></span></div>
    <nav class="menu">
      <button class="pill" data-zone="top" data-action="inputs">Inputs</button>
      <button class="pill" data-zone="top" data-action="settings" id="settingsBtn">Settings</button>
    </nav>
  </header>

  <!-- Gameday: your team's game and the day's schedule. -->
  <section class="game" aria-live="polite">
    <div id="gEyebrow" class="g-eyebrow"></div>
    <div id="gTitle" class="g-title"></div>
    <div id="gMeta" class="g-meta"></div>
    <div id="gOdds" class="g-odds"></div>
  </section>
  <section class="board">
    <!-- Scorebug: away and home, with the kickoff countdown or the live score between them. -->
    <div class="bug">
      <div class="team" id="bugAway"><b></b><span></span></div>
      <div class="mid"><div id="bugState" class="bug-state"></div><div id="bugClock" class="bug-clock"></div></div>
      <div class="team" id="bugHome"><b></b><span></span></div>
    </div>
    <div class="panel">
      <div id="slateTitle" class="slate-title">Today's games</div>
      <ul id="gList" class="slate-list"></ul>
    </div>
  </section>

  <!-- Every app as a line of type. The dock comes first in large type, then all other apps. -->
  <div class="viewport"><ul id="list" class="list"></ul></div>

  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-card">
      <div id="sheetTitle" class="sheet-title"></div>
      <div id="sheetBody" class="sheet-body"></div>
      <div id="sheetList" class="sheet-list"></div>
    </div>
  </section>

  <!-- Countdown to the next Cowboys kickoff, in a football. Samsung only. -->
  <div id="kick" class="kick" aria-live="off">
    <svg class="ball" viewBox="0 0 300 170" aria-hidden="true">
      <defs>
        <radialGradient id="leather" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#a5582f"/><stop offset="0.6" stop-color="#7a3a1d"/><stop offset="1" stop-color="#4f230f"/></radialGradient>
        <clipPath id="ballShape"><path d="M8 85 C 55 8, 245 8, 292 85 C 245 162, 55 162, 8 85 Z"/></clipPath>
      </defs>
      <path d="M8 85 C 55 8, 245 8, 292 85 C 245 162, 55 162, 8 85 Z" fill="url(#leather)"/>
      <g clip-path="url(#ballShape)" stroke="#f4ece2" stroke-width="6" fill="none" opacity="0.9">
        <path d="M46 0 C 38 50, 38 120, 46 170 M60 0 C 52 50, 52 120, 60 170"/>
        <path d="M254 0 C 262 50, 262 120, 254 170 M240 0 C 248 50, 248 120, 240 170"/>
      </g>
      <path d="M118 36 H 182" stroke="#f4ece2" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M126 29 V 43 M138 29 V 43 M150 29 V 43 M162 29 V 43 M174 29 V 43" stroke="#f4ece2" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="kick-text">
      <div class="kick-label">Kickoff</div>
      <div id="kickClock" class="kick-clock"></div>
    </div>
    <div id="kickGame" class="kick-game"></div>
  </div>

  <video id="intro" class="intro-video" playsinline></video>

  <script src="config.js"></script>
  <script src="hosts.js"></script>
  <script src="app.js"></script>
</body>
</html>
