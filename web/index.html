<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>

  <main id="home">
    <header class="top">
      <section class="time">
        <div class="clock"><span id="clock">--:--</span><span id="ampm" class="ampm"></span></div>
        <div id="date" class="date"></div>
        <div id="greeting" class="greeting"></div>
      </section>
      <nav class="actions">
        <button class="pill" data-zone="top" data-action="inputs">Inputs</button>
        <button class="pill" data-zone="top" data-action="settings" id="settingsBtn">Settings</button>
      </nav>
    </header>

    <section class="dock-wrap">
      <div id="dock" class="dock"></div>
      <div id="dockLabel" class="dock-label">&nbsp;</div>
      <div class="hint"><span class="chev"></span>All apps</div>
    </section>
  </main>

  <section id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-title">All apps</div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-card">
      <div id="sheetTitle" class="sheet-title"></div>
      <div id="sheetBody" class="sheet-body"></div>
      <div id="sheetList" class="sheet-list"></div>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="hosts.js"></script>
  <script src="app.js"></script>
</body>
</html>
